<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Escape from Gotham</title>
</head>
<body>

        <img class="batman" src="./assets/img/Batman.gif" alt="Batman">

</html>
